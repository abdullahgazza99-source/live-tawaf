<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIRTUAL TAWAF LIVE 2D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #app-container { width: 1080px; height: 1920px; position: relative; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); overflow: hidden; display: flex; flex-direction: column; }
    
    /* Display Mode */
    #display-view { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { background: transparent; display: block; }
    
    /* Admin Dashboard Mode */
    #admin-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 100; display: none; padding: 40px; overflow-y: auto; }
    .admin-card { background: #1e293b; border-radius: 16px; padding: 24px; margin-bottom: 20px; border: 1px solid #334155; }
    .admin-card h2 { font-size: 28px; margin-bottom: 16px; color: #38bdf8; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 18px; margin-bottom: 8px; color: #94a3b8; }
    .form-control { width: 100%; padding: 16px; font-size: 20px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    .btn { width: 100%; padding: 18px; font-size: 22px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; background: #2563eb; color: #fff; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
    
    /* Navigation Bar */
    #nav-bar { position: absolute; top: 20px; right: 20px; z-index: 200; display: flex; gap: 10px; }
    .nav-btn { background: rgba(30, 41, 59, 0.9); border: 1px solid #475569; color: #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
    .nav-btn:hover { background: #334155; }
  </style>

  <!-- Firebase SDK v9 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    // KELOLA KONFIGURASI FIREBASE ANDA DI SINI
    const firebaseConfig = {
      apiKey: "AIzaSyC1kMjsw6YP0ypb-FNY0fymIyNN784moa4",
  authDomain: "virtual-live-90cf0.firebaseapp.com",
  databaseURL: "https://virtual-live-90cf0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "virtual-live-90cf0",
  storageBucket: "virtual-live-90cf0.firebasestorage.app",
  messagingSenderId: "964693320155",
  appId: "1:964693320155:web:c5f334851a7703c72607fe",
  measurementId: "G-CWJ46MT37P",
      appId: "1:964693320155:web:c5f334851a7703c72607fe"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Expose ke global agar bisa diakses script bawah
    window.db = db;
    window.dbRef = ref;
    window.dbSet = set;
    window.dbPush = push;
    window.dbOnValue = onValue;
    window.dbRemove = remove;
  </script>
</head>
<body>

  <div id="nav-bar">
    <button class="nav-btn" onclick="switchView('display')">Tampilan OBS Live</button>
    <button class="nav-btn" onclick="switchView('admin')">Dashboard Admin</button>
  </div>

  <div id="app-container">
    <!-- DISPLAY OBS -->
    <div id="display-view">
      <canvas id="tawafCanvas" width="1080" height="1920"></canvas>
    </div>

    <!-- DASHBOARD ADMIN -->
    <div id="admin-view">
      <div class="admin-card">
        <h2>Kontrol Admin Tawaf Live</h2>
        <div class="form-group">
          <label>Username TikTok Penonton:</label>
          <input type="text" id="usernameInput" class="form-control" placeholder="Contoh: BudiSantoso">
        </div>
        <div class="form-group">
          <label>Kategori Gift:</label>
          <select id="giftCategory" class="form-control">
            <option value="biasa">Gift Biasa (Bulatan Putih Kecil)</option>
            <option value="sedang">Gift Sedang (Bulatan Putih Besar)</option>
            <option value="besar">Gift Besar (Bulatan Emas / Gold)</option>
          </select>
        </div>
        <button class="btn" onclick="addNewUser()">TAMBAHKAN KE TAWAF</button>
      </div>

      <div class="admin-card">
        <h2>Daftar Pengguna Aktif</h2>
        <div id="activeUsersList" style="font-size: 18px; color: #94a3b8;">Belum ada pengguna aktif.</div>
      </div>
    </div>
  </div>

  <script>
    function switchView(mode) {
      const display = document.getElementById('display-view');
      const admin = document.getElementById('admin-view');
      if (mode === 'admin') {
        display.style.display = 'none';
        admin.style.display = 'block';
      } else {
        display.style.display = 'flex';
        admin.style.display = 'none';
      }
    }

    // Deteksi URL parameter (?mode=admin)
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('mode') === 'admin') {
        switchView('admin');
      }

      // Tunggu database siap lalu load data
      const checkDb = setInterval(() => {
        if (window.db) {
          clearInterval(checkDb);
          initRealtimeSync();
        }
      }, 200);
    });

    // Text-to-Speech Sapaan
    function speakWelcome(username) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance("Selamat datang " + username);
        utterance.lang = 'id-ID';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Tambah User ke Firebase
    window.addNewUser = function() {
      const input = document.getElementById('usernameInput');
      const categorySelect = document.getElementById('giftCategory');
      const username = input.value.trim();
      
      if (!username) {
        alert("Silakan masukkan username terlebih dahulu!");
        return;
      }

      if (!window.db) {
        alert("Koneksi database belum siap. Mohon tunggu beberapa saat.");
        return;
      }

      const usersRef = window.dbRef(window.db, 'activeUsers');
      const newUserRef = window.dbPush(usersRef);
      
      window.dbSet(newUserRef, {
        id: newUserRef.key,
        username: username,
        category: categorySelect.value,
        timestamp: Date.now(),
        laps: 0
      }).then(() => {
        input.value = '';
        speakWelcome(username);
        alert("Berhasil menambahkan " + username + "!");
      }).catch((error) => {
        alert("Gagal menambahkan: " + error.message);
      });
    };

    // Canvas & Animasi 2D Tawaf
    const canvas = document.getElementById('tawafCanvas');
    const ctx = canvas.getContext('2d');
    let activeUsersData = {};

    function initRealtimeSync() {
      const usersRef = window.dbRef(window.db, 'activeUsers');
      window.dbOnValue(usersRef, (snapshot) => {
        const data = snapshot.val();
        activeUsersData = data || {};
        updateAdminList(activeUsersData);
      });
      requestAnimationFrame(drawScene);
    }

    function updateAdminList(data) {
      const listDiv = document.getElementById('activeUsersList');
      const keys = Object.keys(data);
      if (keys.length === 0) {
        listDiv.innerHTML = "Belum ada pengguna aktif.";
        return;
      }
      let html = '<ul style="list-style: none; padding: 0;">';
      keys.forEach(key => {
        const user = data[key];
        html += `<li style="padding: 10px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;">
          <span><b>${user.username}</b> (${user.category})</span>
          <button onclick="removeUser('${user.id}')" style="background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Hapus</button>
        </li>`;
      });
      html += '</ul>';
      listDiv.innerHTML = html;
    }

    window.removeUser = function(id) {
      if (window.db) {
        const userRef = window.dbRef(window.db, 'activeUsers/' + id);
        window.dbRemove(userRef);
      }
    };

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Background Lantai Masjidil Haram
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Garis Radial Lantai
      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 2;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      for (let r = 150; r < 800; r += 100) {
        ctx.beginPath();
        ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 2. Gambar Ka'bah di Tengah
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(centerX - 80, centerY - 80, 160, 160);
      ctx.fillStyle = "#fbbf24"; // Kiswah Aksen Emas
      ctx.fillRect(centerX - 80, centerY - 80, 160, 15);
      
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("KA'BAH", centerX, centerY + 10);

      // 3. Render Karakter Pengguna Berjalan / Tawaf
      const now = Date.now();
      const radius = 300; // Jarak orbit tawaf dari Ka'bah

      Object.values(activeUsersData).forEach((user, index) => {
        const elapsed = (now - user.timestamp) / 1000; // detik
        const speed = 1.5; // Kecepatan putar
        const angle = (elapsed * speed) + (index * 0.8); // Distribusi posisi awal

        const x = centerX + Math.cos(angle) * radius;
        const y = centerY + Math.sin(angle) * radius;

        // Gambar Bulatan User
        ctx.beginPath();
        ctx.arc(x, y, 40, 0, Math.PI * 2);
        
        if (user.category === 'besar') {
          ctx.fillStyle = "#fbbf24"; // Gold
          ctx.shadowColor = "#f59e0b";
          ctx.shadowBlur = 15;
        } else if (user.category === 'sedang') {
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "#38bdf8";
          ctx.shadowBlur = 10;
        } else {
          ctx.fillStyle = "#ffffff";
          ctx.shadowBlur = 0;
        }
        
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = user.category === 'besar' ? "#d97706" : "#cbd5e1";
        ctx.stroke();
        ctx.shadowBlur = 0; // Reset shadow

        // Teks Username di dalam Bulatan
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(user.username.substring(0, 10), x, y);
      });

      requestAnimationFrame(drawScene);
    }
  </script>
</body>
</html>
